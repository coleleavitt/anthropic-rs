[package]
name = "anthropic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Bare, reusable Anthropic SDK: OAuth PKCE auth, a shared multi-account credential store, and a minimal Messages API client"
keywords = ["anthropic", "claude", "oauth", "pkce", "llm"]
categories = ["api-bindings", "authentication"]
repository = "https://github.com/coleleavitt/anthropic-rs"

[features]
# Auth domain types + PKCE + endpoints only. No I/O, no network, no filesystem.
default = ["store", "client"]

# On-disk multi-account credential store rooted at ~/.anthropic-accounts/.
store = []

# reqwest-backed OAuth token client and Messages API client.
client = ["dep:reqwest"]

# Loopback callback server for automatic browser OAuth completion.
interactive-oauth = ["client", "dep:httparse", "dep:tokio"]

# OIDC workload identity federation exchange and single-flight token cache.
federation = ["client", "dep:tokio"]

# Optional operating-system credential vault.
secure-store = ["store", "dep:keyring"]

# Trusted-device, attestation, persistent identity, and P-256 device keys.
device = ["client", "store", "dep:p256"]

# Cowork remote-device registration and create-session binding.
cowork = ["device"]

[dependencies]
base64 = "0.22"
getrandom = "0.3"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

serde_json = { version = "1", features = ["preserve_order"] }
httparse = { version = "1.10", optional = true }
keyring = { version = "3.6", optional = true }
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
tokio = { version = "1.53", features = ["io-util", "net", "rt", "sync", "time"], optional = true }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
    "http2",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
